<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./images/cash-macanaya-HBhy3PyOKGo-unsplash.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" href="./assets/images/java-script_721671.png" />
    <!-- 
    google Fonts
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <!-- 
    google Fonts
    -->
    <title>PMS CRUDS</title>
  </head>
  <body>
    <section class="my-4">
      <div class="container">
        <h1 class="text-center py-3">Product Management System</h1>
        <form class="py-3">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="NameInput"
              placeholder="text"
              autocomplete="off"
              oninput="Validation(NameRegex , NameInput)"
            />
            <label for="NameInput">Name</label>
            <p class="error d-none">
              Name must start with Capital letter followed by 3 characters or
              more
            </p>
          </div>
          <div class="form-floating">
            <input
              type="text"
              class="form-control"
              id="Cotegryinput"
              placeholder="text"
              list="cotegries"
              autocomplete="off"
              oninput="Validation(CotegryRegex , Cotegryinput)"
            />
            <label for="cotegryinput">Category</label>
            <p class="error d-none">
              Category must start with Capital letter followed by 3 characters
              or more
            </p>
            <datalist id="cotegries">
              <option>Mopile</option>
              <option>Laptop</option>
              <option>T-shirt</option>
              <option>Car</option>
              <option>Camera</option>
              <option>keyboard</option>
              <option>Mouse</option>
            </datalist>
          </div>
          <div class="form-floating mb-3 mt-3">
            <input
              type="number"
              class="form-control"
              id="PriceInput"
              placeholder="text"
              autocomplete="off"
              oninput="Validation(PriceRegex , PriceInput)"
            />
            <label for="PriceInput">Price</label>
            <p class="error d-none text-danger">
              Price must nunmber more than 10
            </p>
          </div>
          <div class="form-floating mb-3 mt-3">
            <textarea
              class="form-control"
              id="Descriptioninput"
              placeholder="text"
              oninput="Validation(DescriptionRegex , Descriptioninput)"
            ></textarea>
            <label for="DescriptionInput">Description</label>
            <p class="error d-none text-danger">
              Description must be more than 25 to 200 characters
            </p>
          </div>
          <div>
            <input
              type="file"
              class="form-control"
              id="imageinput"
              accept="image/*"
            />
          </div>
          <button
            type="button"
            id="add"
            class="btn btn-primary mt-3 fs-5"
            onclick="AddProduct()"
          >
            Add product
          </button>
          <button
            type="button"
            id="Edite"
            onclick="EditeProdact()"
            class="d-none btn btn-primary mt-3 fs-5"
          >
            Edite product
          </button>
          <i class="fa-solid fa-circle-xmark"></i>
        </form>
        <input
          type="search"
          class="form-control w-75 mx-auto my-3"
          placeholder="search prodauct......"
          oninput="searchInput()"
          id="inputsearch"
        />
        <div class="row mt-3" id="ProductContenar"></div>
      </div>
    </section>

    <script src="./JS/index.JS"></script>
  </body>
</html>
